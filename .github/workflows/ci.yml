name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Dbms.slnx

      - name: Build
        run: dotnet build .\Dbms.slnx -c Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test .\tests\Dbms.Core.Tests\Dbms.Core.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Check vulnerable NuGet packages
        run: dotnet list .\src\Dbms.App\Orbit.DataBridge.csproj package --vulnerable --include-transitive
